# Smart Itinerary — local infrastructure stack (T0.2).
#
# Dev-only credentials, never exposed publicly. When migrating to AWS, each
# service here maps to a managed equivalent (see docs/TASKS.md §1.2):
#   postgres  -> Amazon RDS (one database per service)
#   rabbitmq  -> Amazon MQ (RabbitMQ) or SQS
#   s3        -> Amazon S3 (SeaweedFS locally, same API; unset S3_ENDPOINT)
#   mailpit   -> Amazon SES (SMTP interface — same mailer adapter)
#
# Application containers (gateway + 5 services + web) are added by their own
# Phase 1 / Phase 2 tasks so each lands tested with the code it ships.

name: smart-itinerary

services:
  # ---------------------------------------------------------------- databases
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: smart
      POSTGRES_DB: smart_auth
    ports:
      - "5433:5432"
    volumes:
      - ./db/init/auth-service.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart -d smart_auth"]
      interval: 5s
      timeout: 3s
      retries: 12

  itinerary-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: smart
      POSTGRES_DB: smart_itinerary
    ports:
      - "5434:5432"
    volumes:
      - ./db/init/itinerary-service.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - itinerary-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart -d smart_itinerary"]
      interval: 5s
      timeout: 3s
      retries: 12

  gemini-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: smart
      POSTGRES_DB: smart_gemini
    ports:
      - "5435:5432"
    volumes:
      - ./db/init/gemini-service.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - gemini-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart -d smart_gemini"]
      interval: 5s
      timeout: 3s
      retries: 12

  tools-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: smart
      POSTGRES_DB: smart_tools
    ports:
      - "5436:5432"
    volumes:
      - ./db/init/tools-service.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - tools-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart -d smart_tools"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ------------------------------------------------------------- message broker
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI (guest/guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------- file storage
  # SeaweedFS, not MinIO: MinIO withdrew the community images in three rounds
  # (2025 tag purge → 2026-09-12 Hub repos deleted → 2026-10-03 quay went
  # auth-only + dl.min.io returns 410), and the last mirror (bitnamilegacy)
  # is frozen 2025 bits. SeaweedFS is a CNCF Sandbox project (canonical repo
  # seaweedfs/seaweedfs, ~35k stars, v4.48 on 2026-09-28) whose own CI
  # publishes this image to Docker Hub + ghcr. Pinned by digest to the exact
  # multi-arch build the swap was verified against: CreateBucket, PutObject,
  # GetObject, ListBucket and presigned download all pass over the same AWS
  # SDK path tools-service uses. S3 API is on :8333 internally, published on
  # host :9000 as before. It accepts any credentials by default (no identity
  # config) — dev-only, never exposed. No MinIO-style object console; the
  # master UI is on :9333 inside the compose network if ever needed.
  s3:
    image: chrislusf/seaweedfs@sha256:aba492e2a4e4c90bff795745e8e660affa1f09e7650f5981bd7bccd1a06cd931
    command: server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -s3
    ports:
      - "9000:8333"    # S3 API (host :9000, same as always)
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot bucket creation. The AWS-published CLI image replaces the old
  # mc one-shot — mc came bundled with MinIO, and SeaweedFS needs no client
  # of its own. Head-bucket first so re-up runs stay idempotent.
  s3-init:
    image: amazon/aws-cli@sha256:92de75724b6a746951f0e8b915d86bbccd7cb55aff96cd0cb4f7017272160780
    environment:
      AWS_ACCESS_KEY_ID: smart
      AWS_SECRET_ACCESS_KEY: smart-local-dev
      AWS_DEFAULT_REGION: ap-southeast-1
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        aws s3api head-bucket --bucket si-files --endpoint-url http://s3:8333 2>/dev/null ||
        aws s3api create-bucket --bucket si-files --endpoint-url http://s3:8333 &&
        echo 'bucket si-files ready'
      "

  # --------------------------------------------------------------------- email
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"    # SMTP
      - "8025:8025"    # Web UI
    volumes:
      - mailpit-data:/data

  # ------------------------------------------------------------ API gateway
  # No DB/AMQP lines: the gateway holds no state (Service conventions).
  # Upstream services register their own compose blocks in later tasks; until
  # then the gateway reports them as "down" instead of failing (T1.1 design).
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      SERVICE_NAME: gateway
      PORT: "8080"
      LOG_LEVEL: info
      # Auth mode — dev tokens by default. Real Google sign-in (Cognito):
      # set TOKEN_VERIFY_MODE=cognito + COGNITO_* in the root .env; ALL five
      # verifying services read the same three vars and must flip together
      # (infra/terraform/modules/cognito/RUNBOOK.md has the full path).
      TOKEN_VERIFY_MODE: ${TOKEN_VERIFY_MODE:-dev}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      JWT_DEV_SECRET: dev-only-secret
      AUTH_SERVICE_URL: http://auth-service:8081
      ITINERARY_SERVICE_URL: http://itinerary-service:8082
      GEMINI_SERVICE_URL: http://gemini-service:8083
      TOOLS_SERVICE_URL: http://tools-service:8084
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --------------------------------------------------- auth-service (Phase 1)
  # Diagram: "Authentication Service (User Profile)" — owns users +
  # users_demographics in auth-db; the gateway proxies /api/auth/* here.
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      SERVICE_NAME: auth-service
      PORT: "8081"
      DATABASE_URL: postgres://smart:smart@auth-db:5432/smart_auth
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      LOG_LEVEL: info
      TOKEN_VERIFY_MODE: ${TOKEN_VERIFY_MODE:-dev}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------- application: itinerary-service
  itinerary-service:
    build:
      context: .
      dockerfile: services/itinerary-service/Dockerfile
    environment:
      SERVICE_NAME: itinerary-service
      PORT: "8082"
      DATABASE_URL: postgres://smart:smart@itinerary-db:5432/smart_itinerary
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      LOG_LEVEL: info
      TOKEN_VERIFY_MODE: ${TOKEN_VERIFY_MODE:-dev}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    ports:
      - "8082:8082"
    depends_on:
      itinerary-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -------------------------------------------------- application: gemini-service
  # Diagram: "Gemini Service (Hotel Service)" — AI generation, hotels,
  # flights, reference data. Third-party keys (GEMINI_API_KEY /
  # AMADEUS_API_KEY) come from the shell/.env, never committed; without them
  # the service still boots and only AI/flight endpoints answer 503.
  gemini-service:
    build:
      context: .
      dockerfile: services/gemini-service/Dockerfile
    environment:
      SERVICE_NAME: gemini-service
      PORT: "8083"
      DATABASE_URL: postgres://smart:smart@gemini-db:5432/smart_gemini
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      LOG_LEVEL: info
      TOKEN_VERIFY_MODE: ${TOKEN_VERIFY_MODE:-dev}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AMADEUS_API_KEY: ${AMADEUS_API_KEY:-}
      AMADEUS_FLIGHTS_API_BASE_URL: ${AMADEUS_FLIGHTS_API_BASE_URL:-https://test.api.amadeus.com/v2}
    ports:
      - "8083:8083"
    depends_on:
      gemini-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --------------------------------------------------- email-service (Phase 1)
  # Diagram: "Email Service" — consumes notifications + TTL-expired reminders
  # from RabbitMQ and sends mail over SMTP (mailpit). AMQP-only: no DB.
  # No depends_on mailpit — it defines no healthcheck to gate on; a send
  # while Mailpit is down fails soft (shared broker retries once, then drops).
  email-service:
    build:
      context: .
      dockerfile: services/email-service/Dockerfile
    environment:
      SERVICE_NAME: email-service
      PORT: "8085"
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: Smart Itinerary <no-reply@smart-itinerary.local>
      OWNER_EMAIL_FALLBACK: owner@smart-itinerary.local
      WEB_APP_URL: http://localhost:3000
      LOG_LEVEL: info
    ports:
      - "8085:8085"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------ application: tools-service
  # Diagram: "Tools Service (Export PDF, Sharing)" — owns groups, invites and
  # share links in tools-db, uploads PDFs to the s3 service (S3 adapter) and fetches
  # itinerary aggregates from itinerary-service for export/share views. The
  # gateway proxies /api/tools/* here.
  tools-service:
    build:
      context: .
      dockerfile: services/tools-service/Dockerfile
    environment:
      SERVICE_NAME: tools-service
      PORT: "8084"
      DATABASE_URL: postgres://smart:smart@tools-db:5432/smart_tools
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      S3_ENDPOINT: http://s3:8333
      # Presigned PDF URLs are followed by the BROWSER, so they must be
      # signed for the host's published S3 port, not the internal name.
      # On real S3 leave S3_PUBLIC_ENDPOINT unset — S3 URLs are public.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: ap-southeast-1
      S3_BUCKET: si-files
      TOKEN_VERIFY_MODE: ${TOKEN_VERIFY_MODE:-dev}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      S3_ACCESS_KEY_ID: smart
      S3_SECRET_ACCESS_KEY: smart-local-dev
      S3_FORCE_PATH_STYLE: "true"
      S3_PRESIGN_TTL_SECONDS: "3600"
      ITINERARY_SERVICE_URL: http://itinerary-service:8082
      # Public origin of the web app — share links must resolve in the
      # BROWSER, so this is the host's origin, not a compose hostname.
      WEB_PUBLIC_URL: http://localhost:3000
      LOG_LEVEL: info
    ports:
      - "8084:8084"
    depends_on:
      tools-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  auth-db-data:
  itinerary-db-data:
  gemini-db-data:
  tools-db-data:
  rabbitmq-data:
  s3-data:
  mailpit-data:
